<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        html {
            visibility: hidden;
            opacity: 0;
            display: none;
        }

        html.unloading #blazor-error-ui {
            display: none !important;
        }
    </style>
    <meta charset="utf-8" />
    <meta name="referrer" content="origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A Hacker News reader built with Blazor WebAssembly">
    <link rel="canonical" href="https://glipitch.github.io/hnwasm/">
    <link rel="icon" href="favicon-16x16.png" sizes="16x16" type="image/png"><link rel="icon" href="favicon-32x32.png" sizes="32x32" type="image/png"><link rel="icon" href="favicon.png" sizes="512x512" type="image/png"><link rel="apple-touch-icon" href="favicon.png">
    <link rel="preconnect" href="https://hacker-news.firebaseio.com">
    <title>HN Wasm</title>
    <base href="/" />
    <link href="app.css" rel="stylesheet" />
    <link href="HnWasm.styles.css" rel="stylesheet" />
    <script>
        setThemeData = value => document.documentElement.dataset.theme = value;
        setThemeData(localStorage.getItem("theme") == "light" ? "light" : "dark");
        addEventListener("beforeunload", () => document.documentElement.classList.add("unloading"));
        addEventListener("pagehide", () => document.documentElement.classList.add("unloading"));
    </script>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="HN Wasm">
  <meta property="og:title" content="HN Wasm — a Hacker News reader">
  <meta property="og:description" content="A Hacker News reader built with Blazor WebAssembly.">
  <meta property="og:url" content="https://glipitch.github.io/hnwasm/">
  <meta property="og:image" content="https://glipitch.github.io/hnwasm/share-card-v1.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="HN Wasm — A reader for Hacker News. An orange H beside a minimal story list.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="HN Wasm — a Hacker News reader">
  <meta name="twitter:description" content="A Hacker News reader built with Blazor WebAssembly.">
  <meta name="twitter:image" content="https://glipitch.github.io/hnwasm/share-card-v1.png">
  <meta name="twitter:image:alt" content="HN Wasm — A reader for Hacker News. An orange H beside a minimal story list.">
</head>
<body>
    <div id="app">
        <span style="display: block; color: var(--primary-text-color);">Loading...</span>
    </div>
    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">x</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
