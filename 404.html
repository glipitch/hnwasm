<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        html.unloading #blazor-error-ui {
            display: none !important;
        }
    </style>
    <meta charset="utf-8" />
    <meta name="referrer" content="origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A Hacker News reader built with Blazor WebAssembly">
    <link rel="canonical" href="https://glipitch.github.io/hnwasm/">
    <link rel="shortcut icon" href="favicon.png">
    <link rel="preconnect" href="https://hacker-news.firebaseio.com">
    <title>HN Wasm</title>
    <base href="/hnwasm/" />
    <link href="app.css" rel="stylesheet" />
    <link href="HnWasm.styles.css" rel="stylesheet" />
    <script>
        setThemeData = value => document.documentElement.dataset.theme = value;
        setThemeData(localStorage.getItem("theme") == "light" ? "light" : "dark");
        addEventListener("beforeunload", () => document.documentElement.classList.add("unloading"));
        addEventListener("pagehide", () => document.documentElement.classList.add("unloading"));
    </script>
</head>
<body>
    <div id="app">
        <main class="reader-intro">
            <h1>HN Wasm — Hacker News reader</h1>
            <p>Browse top Hacker News stories and their discussions. Choose a light or dark theme, adjust the number of stories per page, and swipe between pages on mobile.</p>
            <p>Loading stories… You can also visit <a href="https://news.ycombinator.com/">Hacker News</a>.</p>
            <noscript><p>Enable JavaScript to use the interactive reader.</p></noscript>
        </main>
    </div>
    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">x</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
